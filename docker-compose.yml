name: uamishop-app

services:
  mysql:
    image: mysql:latest
    container_name: uamishop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: uamishop
      MYSQL_PASSWORD: uamishop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # IMPORTANTE: Este script debe crear las 3 bases de datos (ver nota abajo)
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uamishop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  uamishop-catalogo:
    build:
      context: ./uamishop-catalogo
      dockerfile: Dockerfile
    image: uamishop-catalogo:latest
    container_name: uamishop-catalogo
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/uamishop_catalogo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: uamishop
      SPRING_DATASOURCE_PASSWORD: uamishop
      SPRING_RABBITMQ_HOST: rabbitmq
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  uamishop-ventas:
    build:
      context: ./uamishop-ventas
      dockerfile: Dockerfile
    image: uamishop-ventas:latest
    container_name: uamishop-ventas
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/uamishop_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: uamishop
      SPRING_DATASOURCE_PASSWORD: uamishop
      SPRING_RABBITMQ_HOST: rabbitmq
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  uamishop-ordenes:
    build:
      context: ./uamishop-ordenes
      dockerfile: Dockerfile
    image: uamishop-ordenes:latest
    container_name: uamishop-ordenes
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/uamishop_ordenes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: uamishop
      SPRING_DATASOURCE_PASSWORD: uamishop
      SPRING_RABBITMQ_HOST: rabbitmq
      # URLs para comunicación síncrona vía REST
      CATALOGO_SERVICE_URL: "http://uamishop-catalogo:8081"
      VENTAS_SERVICE_URL: "http://uamishop-ventas:8082"
      JAVA_OPTS: "-Xmx256m -Xms128m"
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  mysql_data: