server:
  port: 8080  # Puerto del API Gateway

spring:
  application:
    name: uamishop-gateway
  
  cloud:
    gateway:
      globalcors: # Practica 9 - Configuración global de CORS para permitir solicitudes desde cualquier origen
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Ruta para el microservicio de catálogo
        - id: catalogo-service
          uri: http://uamishop-catalogo:8081  # Practica 9 - Usamos el nombre del servicio definido en docker-compose para resolverlo a través de Docker DNS 
          predicates:
            - Path=/api/v1/catalogo/**
          filters:
            - RewritePath=/api/v1/catalogo/(?<segment>.*), /api/v2/$\{segment}
            - name: CircuitBreaker
              args:
                name: catalogoService
                fallbackUri: forward:/fallback/catalogo
        
        # Ruta para el microservicio de órdenes
        - id: ordenes-service
          uri: http://uamishop-ordenes:8083 # Practica 9 - Usamos el nombre del servicio definido en docker-compose para resolverlo a través de Docker DNS
          predicates:
            - Path=/api/v1/ordenes/**
          filters:
            - RewritePath=/api/v1/ordenes/(?<segment>.*), /api/v2/ordenes/$\{segment}
            - name: CircuitBreaker
              args:
                name: ordenesService
                fallbackUri: forward:/fallback/ordenes
        
        # Ruta para el microservicio de ventas
        - id: ventas-service
          uri: http://uamishop-ventas:8082 # Practica 9 - Usamos el nombre del servicio definido en docker-compose para resolverlo a través de Docker DNS
          predicates:
            - Path=/api/v1/ventas/**
          filters:
            - RewritePath=/api/v1/ventas/(?<segment>.*), /api/v2/ventas/$\{segment}
            - name: CircuitBreaker
              args:
                name: ventasService
                fallbackUri: forward:/fallback/ventas
        
        # Ruta para carritos (probablemente parte de ventas)
        - id: carritos-service
          uri: http://uamishop-ventas:8082 # Practica 9 - Usamos el nombre del servicio definido en docker-compose para resolverlo a través de Docker DNS
          predicates:
            - Path=/api/v1/carritos/**
          filters:
            - RewritePath=/api/v1/carritos/(?<segment>.*), /api/v2/carritos/$\{segment}
            - name: CircuitBreaker
              args:
                name: carritosService
                fallbackUri: forward:/fallback/carritos

# Configuración de Resilience4J para el gateway
resilience4j:
  circuitbreaker:
    instances:
      catalogoService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
      ordenesService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      ventasService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      carritosService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000

# Configuración de logs
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG