# Configuración del servidor
server.port=8083
spring.application.name=uamishop-ordenes

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/uamishop_ordenes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=uamishop
spring.datasource.password=uamishop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=ordenes

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Adaptadores HTTP - URLs de servicios
ventas.service.url=http://uamishop-ventas:8082
catalogo.service.url=http://uamishop-catalogo:8081

# Forward headers para que funcione correctamente con proxies
server.forward-headers-strategy=framework