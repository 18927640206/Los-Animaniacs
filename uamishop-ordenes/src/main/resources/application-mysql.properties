# Perfil MySQL: usar con -Dspring.profiles.active=mysql

# Configuración del servidor
server.port=8083
spring.application.name=uamishop-ordenes

# Configuración de la fuente de datos (DataSource)
# URL de conexión a la base de datos MySQL, incluyendo parámetros para SSL, zona horaria y recuperación de clave pública
spring.datasource.url=jdbc:mysql://mysql:3306/uamishop_ordenes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Clase del controlador JDBC para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Nombre de usuario para la conexión a la base de datos
spring.datasource.username=uamishop
# Contraseña para la conexión a la base de datos
spring.datasource.password=uamishop

# Configuración de JPA (Java Persistence API) con Hibernate
# Plataforma de base de datos para Hibernate (dialecto MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Estrategia de DDL automático: 'update' actualiza el esquema automáticamente
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL generadas en la consola
spring.jpa.show-sql=true
# Formatear las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true
# Esquema por defecto
spring.jpa.properties.hibernate.default_schema=ordenes

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Adaptadores HTTP - URLs de servicios
ventas.service.url=http://uamishop-ventas:8082
catalogo.service.url=http://uamishop-catalogo:8081

# Sin consola H2 en este perfil
spring.h2.console.enabled=false

# Forward headers para que funcione correctamente con proxies
server.forward-headers-strategy=framework
