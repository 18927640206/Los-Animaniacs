# Perfil MySQL: usar con -Dspring.profiles.active=mysql

# Configuración de la fuente de datos (DataSource)
# URL de conexión a la base de datos MySQL, incluyendo parámetros para SSL, zona horaria y recuperación de clave pública
spring.datasource.url=jdbc:mysql://localhost:3306/uamishop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Clase del controlador JDBC para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Nombre de usuario para la conexión a la base de datos
spring.datasource.username=uamishop
# Contraseña para la conexión a la base de datos
spring.datasource.password=uamishop

# Configuración de JPA (Java Persistence API) con Hibernate
# Plataforma de base de datos para Hibernate (dialecto MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Estrategia de DDL automático: 'update' actualiza el esquema automáticamente
spring.jpa.hibernate.ddl-auto=update
# Mostrar las consultas SQL generadas en la consola
spring.jpa.show-sql=true
# Formatear las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Sin consola H2 en este perfil
# Deshabilitar la consola web de H2 (no se usa en producción o perfiles MySQL)
spring.h2.console.enabled=false