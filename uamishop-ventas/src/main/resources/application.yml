server:
  port: 8082

spring:
  application:
    name: uamishop-ventas
  datasource:
    url: jdbc:mysql://mysql:3306/uamishop_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: uamishop
    password: uamishop
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ventas
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest